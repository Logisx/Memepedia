[project]
name = "memepedia"
version = "0.1.0"
description = "Memepedia backend: live meme sightings and cited lineage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.7",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "pillow>=11.3",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memepedia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgserver.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
